<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form BPJS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00964f; --green-d:#007a40; --green-l:#34c27a; --navy:#1d2a73;
  --bg:#eef4f0; --paper:#ffffff; --ink:#142038; --muted:#63708a; --line:#d7e2da; --field:#f3f7f4;
  --err:#c2271d; --ring:rgba(0,150,79,.22); --dot:rgba(29,42,115,.10);
  --head:'Sora','Segoe UI',system-ui,sans-serif; --body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --shadow:0 18px 40px -22px rgba(19,28,82,.35);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0c1511;--paper:#14211b;--ink:#e9f1ec;--muted:#9bb0a4;--line:#27392f;--field:#1a2b23;--err:#ff8e85;--ring:rgba(62,207,130,.28);--dot:rgba(255,255,255,.06);--green:#2fc57c;--green-d:#52d896;--shadow:0 18px 40px -22px #000}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font:400 16px/1.55 var(--body);padding:28px 16px 56px;
  background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:22px 22px}
.page{max-width:1040px;margin:0 auto}
.hero{border-radius:22px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:22px}
.hero img{display:block;width:100%;height:auto}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:20px}
@media (max-width:860px){.grid{grid-template-columns:1fr}.side{position:static}}

/* ---------- Kartu live ---------- */
.idcard{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(150deg,var(--green) 0%,#0a7a58 55%,var(--navy) 130%);color:#fff;box-shadow:var(--shadow);transform:rotate(-1.2deg);transition:transform .4s}
.idcard:hover{transform:rotate(0)}
.idcard::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1.4px,transparent 1.6px);background-size:16px 16px;-webkit-mask-image:linear-gradient(120deg,transparent 35%,#000);mask-image:linear-gradient(120deg,transparent 35%,#000)}
.idcard .logo{position:relative;background:#fff;padding:12px 18px 10px}
.idcard .logo img{display:block;height:34px;width:auto}
.idcard .body{position:relative;padding:20px 22px 24px}
.idcard .tag{font:600 13px var(--body);opacity:.85;margin:0 0 12px;letter-spacing:.02em}
.idcard .nm{font:700 clamp(22px,3vw,26px)/1.15 var(--head);min-height:1.15em;margin:0 0 4px;word-break:break-word}
.idcard .npp{font:500 15px var(--body);opacity:.9;margin:0 0 18px}
.idcard dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:0}
.idcard dl .full{grid-column:1/-1}
.idcard dt{font-size:12.5px;opacity:.75;margin:0}
.idcard dd{margin:0;font-weight:600;min-height:1.4em;word-break:break-word;font-size:15px}
.ph{opacity:.45}
.fill-in{animation:ink .45s ease}
@keyframes ink{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.stamp{position:absolute;right:16px;bottom:18px;border:3px solid #fff;border-radius:12px;padding:6px 14px;font:700 20px var(--head);letter-spacing:.06em;transform:rotate(-14deg) scale(2.2);opacity:0;pointer-events:none;background:rgba(0,150,79,.35);backdrop-filter:blur(2px)}
.idcard.sent .stamp{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{to{transform:rotate(-14deg) scale(1);opacity:1}}
.note{margin:16px 6px 0;color:var(--muted);font-size:14px}

/* ---------- Panel ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:clamp(22px,4vw,38px)}
.panel h1{font:700 clamp(26px,4.5vw,34px)/1.12 var(--head);margin:0 0 18px;letter-spacing:-.02em}
.stepper{display:flex;gap:8px;margin:0 0 14px}
.st{flex:1;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--field);color:var(--muted);font-weight:600;font-size:14px;border:2px solid transparent;min-width:0}
.st b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink);font-size:13px;transition:.25s}
.st b svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.st span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st.cur{border-color:var(--green);color:var(--ink)}
.st.cur b,.st.done b{background:var(--green);color:#fff}
@media (max-width:560px){.st span{display:none}.st.cur span{display:inline}.st.cur{flex:3}}
.progress{display:flex;align-items:center;gap:12px;margin:0 0 26px}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:5px;border-radius:99px;background:var(--line);transition:background .3s}
.segs i.on{background:linear-gradient(90deg,var(--green),var(--green-l))}
.progress span{font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}

.step{animation:rise .35s ease}
.stephead{font:700 20px/1.2 var(--head);margin:0 0 6px;display:flex;align-items:center;gap:10px}
.stephead::before{content:"";width:6px;height:22px;border-radius:99px;background:var(--green)}
.stepdesc{margin:0 0 16px;color:var(--muted)}
.callout{background:var(--field);border-left:4px solid var(--green);border-radius:12px;padding:12px 16px;margin:0 0 24px;font-size:14.5px}
.callout a{color:var(--green-d);font-weight:700;word-break:break-all}

.field{position:relative;margin:0 0 18px;border:0;padding:0;min-width:0}
.ctl{position:relative}
.ctl>svg.ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s;pointer-events:none}
.ctl input,.ctl select,.ctl textarea{width:100%;font:500 16px var(--body);color:var(--ink);background:var(--field);border:2px solid transparent;border-radius:16px;
  padding:25px 46px 9px 48px;height:62px;transition:border-color .2s,box-shadow .2s,background .2s}
.ctl select{appearance:none;cursor:pointer;padding-right:78px}
.ctl select option{color:#142038}
.ctl.sel::after{content:"";position:absolute;right:52px;top:50%;width:8px;height:8px;border:solid var(--muted);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.ctl label.fl{position:absolute;left:48px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;transition:all .18s;font-weight:500;max-width:calc(100% - 100px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl input:focus~label.fl,.ctl input:not(:placeholder-shown)~label.fl,
.ctl select:focus~label.fl,.ctl select:valid~label.fl{top:15px;font-size:12px;font-weight:600;color:var(--green-d);transform:none;max-width:calc(100% - 70px)}
.ctl input:focus,.ctl select:focus{outline:none;background:var(--paper);border-color:var(--green);box-shadow:0 0 0 5px var(--ring)}
.ctl:focus-within>svg.ic{stroke:var(--green)}
.ok{position:absolute;right:16px;top:50%;transform:translateY(-50%) scale(0);width:22px;height:22px;border-radius:50%;background:var(--green);display:grid;place-items:center;transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.ok svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.field.good .ok{transform:translateY(-50%) scale(1)}
.err-msg{display:none;color:var(--err);font-size:13.5px;font-weight:600;margin:7px 4px 0}
.field.invalid .err-msg{display:block;animation:shake .35s}
.field.invalid .ctl input,.field.invalid .ctl select{border-color:var(--err);background:var(--paper)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.req{color:var(--err)}

/* ---------- Upload ---------- */
fieldset.file legend{font-weight:600;padding:0;margin:0 0 2px}
.fhint{display:block;color:var(--muted);font-size:13.5px;margin:0 0 10px}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.drop{display:flex;align-items:center;gap:14px;padding:16px 18px;border:2px dashed var(--line);border-radius:16px;cursor:pointer;background:var(--field);transition:.15s;font-weight:600}
.drop:hover,.drop.over,.vh:focus-visible+.drop{border-color:var(--green);background:var(--paper)}
.vh:focus-visible+.drop{box-shadow:0 0 0 4px var(--ring)}
.drop svg{flex:none;width:24px;height:24px;stroke:var(--green);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.drop small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.picked{display:none;align-items:center;gap:12px;padding:10px 12px;border:2px solid var(--green);border-radius:16px;background:var(--field)}
.file.has .drop{display:none}
.file.has .picked{display:flex;animation:rise .3s}
.file.invalid .drop{border-color:var(--err)}
.thumb{flex:none;width:52px;height:52px;border-radius:12px;overflow:hidden;background:var(--green);color:#fff;display:grid;place-items:center;font:700 12px var(--head);text-transform:uppercase}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pinfo{min-width:0}
.pname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psize{color:var(--muted);font-size:13px}
button.rm{margin-left:auto;background:none;box-shadow:none;color:var(--muted);padding:8px 12px;font-size:14px;font-weight:600;border-radius:10px}
button.rm:hover{transform:none;box-shadow:none;color:var(--err)}

.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:28px}
.actions .sp{flex:1}
button{font:700 16px var(--body);cursor:pointer;border:0;border-radius:16px;padding:17px 30px;color:#fff;background:linear-gradient(135deg,var(--green),var(--green-d));box-shadow:0 10px 22px -10px var(--green);transition:transform .15s,box-shadow .15s}
@media (prefers-color-scheme:dark){button{color:#052418}}
button:hover{transform:translateY(-2px);box-shadow:0 16px 26px -12px var(--green)}
button:active{transform:translateY(0)}
button:disabled{opacity:.65;cursor:wait;transform:none}
button:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
button.ghost{background:none;box-shadow:none;color:var(--muted);font-weight:600;padding:17px 14px}
button.ghost:hover{color:var(--ink);transform:none;box-shadow:none}
button.outline{background:var(--paper);color:var(--green-d);box-shadow:none;border:2px solid var(--green);padding:15px 26px}
button.outline:hover{box-shadow:none;background:var(--field)}
.spin{display:none;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-3px;margin-right:8px}
button.loading .spin{display:inline-block}
@keyframes r{to{transform:rotate(360deg)}}

/* ---------- Penutup ---------- */
.done.show{animation:rise .45s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.thanks{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:22px}
.thanks h2{margin:0;padding:16px 22px;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;font:700 clamp(18px,3.4vw,22px)/1.25 var(--head)}
.thanks .in{padding:20px 22px}
.thanks p{margin:0 0 12px}
.thanks ol{margin:0;padding-left:0;list-style:none;display:grid;gap:10px;counter-reset:c}
.thanks li{counter-increment:c;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.thanks li::before{content:counter(c);flex:none;width:26px;height:26px;border-radius:50%;background:var(--field);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--green-d)}
.thanks li span{color:var(--muted);min-width:96px}
.thanks a{color:var(--green-d);font-weight:700;text-decoration:none;word-break:break-all}
.thanks a:hover{text-decoration:underline}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--err);color:#fff;padding:13px 20px;border-radius:14px;font-weight:600;display:none;max-width:90vw;z-index:9}
.toast.show{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.idcard{transform:none}.idcard.sent .stamp{opacity:1;transform:rotate(-14deg)}}
</style>
</head>

  badge:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16.5c.6-1.6 1.8-2.4 3.2-2.4s2.6.8 3.2 2.4M15 9.5h3.5M15 13h3.5"/>',
  pin:'<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  hash:'<path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/>',
  hospital:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 8v6M9 11h6M10 21v-4h4v4"/>',
  text:'<path d="M5 7h14M5 12h14M5 17h9"/>'
};
const svg = k => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]||ICONS.text}</svg>`;
const TICK = '<span class="ok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const star = f => f.required ? ' <span class="req" aria-hidden="true">*</span>' : '';
const UPLOAD_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>';
const ACCEPT = ".pdf,.doc,.docx,.jpg,.jpeg,.png,.gif,.webp,.svg";
const OK_EXT = ACCEPT.replace(/\./g,"").split(",");

document.title = FORM_TITLE;
$("#title").textContent = FORM_TITLE;
$("#doneTitle").textContent = DONE_TITLE;
$("#doneBody").innerHTML = DONE_HTML;

const FIELDS = [];
STEPS.forEach((s,si)=>s.fields.forEach(f=>{ f.step = si; f.i = FIELDS.length; FIELDS.push(f); }));
const BYKEY = {}; FIELDS.forEach(f=>{ if(f.key) BYKEY[f.key] = f.i; });
const LAST = STEPS.length - 1;

STEPS.forEach((s,si)=>{
  const sec = document.createElement("section");
  sec.className = "step"; sec.dataset.s = si;
  let h = `<h2 class="stephead">${esc(s.head)}</h2>` + (s.desc?`<p class="stepdesc">${esc(s.desc)}</p>`:"") + (s.callout?`<div class="callout">${s.callout}</div>`:"");
  sec.innerHTML = h;
  s.fields.forEach(f=>{
    const id = "f"+f.i, req = f.required?"required":"", ac = f.autocomplete?`autocomplete="${f.autocomplete}"`:"";
    const el = document.createElement(f.type==="file"?"fieldset":"div");
    el.className = "field" + (f.type==="file"?" file":""); el.dataset.i = f.i;
    let x = "";
    if (["text","email","tel"].includes(f.type)){
      x = `<div class="ctl">${svg(f.icon)}<input id="${id}" type="${f.type}" name="${esc(f.name)}" placeholder=" " ${req} ${ac}><label class="fl" for="${id}">${esc(f.name)}${star(f)}</label>${TICK}</div>`;
    } else if (f.type==="select"){
      x = `<div class="ctl sel">${svg(f.icon)}<select id="${id}" name="${esc(f.name)}" ${req}><option value="" hidden></option>${f.options.map(o=>`<option>${esc(o)}</option>`).join("")}</select><label class="fl" for="${id}">${esc(f.name)}${star(f)}</label>${TICK}</div>`;
    } else if (f.type==="file"){
      x = `<legend>${esc(f.name)}${star(f)}</legend>
        <span class="fhint">Upload 1 file yang didukung: PDF, dokumen, atau gambar. Maks ${MAX_FILE_MB} MB.</span>
        <input class="vh" type="file" id="${id}" accept="${ACCEPT}">
        <label class="drop" for="${id}" data-drop>${UPLOAD_SVG}<span>Tambahkan file<small>atau tarik file ke sini</small></span></label>
        <div class="picked"><div class="thumb"></div><div class="pinfo"><div class="pname"></div><div class="psize"></div></div><button type="button" class="rm" data-rm>Hapus</button></div>`;
    }
    x += `<div class="err-msg">${f.type==="email"?"Masukkan alamat email yang valid.":f.type==="tel"?"Masukkan nomor telepon yang valid.":f.type==="file"?"Dokumen ini wajib diunggah.":"Kolom ini wajib diisi."}</div>`;
    el.innerHTML = x; sec.appendChild(el);
  });
  $("#steps").appendChild(sec);
});

$("#stepper").innerHTML = STEPS.map((s,i)=>`<div class="st" data-st="${i}"><b>${i+1}</b><span>${esc(s.title)}</span></div>`).join("");
const reqFields = FIELDS.filter(f=>f.required);
$("#segs").innerHTML = reqFields.map(()=>"<i></i>").join("");

/* =====================================================================
   FILE
   ===================================================================== */
const files = {};   // index field -> File
const fmtSize = n => n>=1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(n/1024))+" KB";
const extOf = n => (n.split(".").pop()||"").toLowerCase();

async function shrink(file){
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 900*1024) return file;
  try{
    const bmp = await createImageBitmap(file), max = 2000, sc = Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",.82));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/,"")+".jpg", {type:"image/jpeg"});
  }catch(e){ return file; }
}
function boxOf(i){ return form.querySelector(`.field[data-i="${i}"]`); }
function clearFile(i){
  const box = boxOf(i); delete files[i];
  const img = box.querySelector(".thumb img"); if (img) URL.revokeObjectURL(img.src);
  box.querySelector("input[type=file]").value = "";
  box.classList.remove("has"); refresh();
}
async function setFile(i, file){
  const box = boxOf(i);
  if (!file) return;
  if (!OK_EXT.includes(extOf(file.name))) { toast("Format file tidak didukung. Gunakan PDF, dokumen, atau gambar."); box.querySelector("input[type=file]").value=""; return; }
  if (file.size > MAX_FILE_MB*1048576) { toast(`Ukuran file melebihi ${MAX_FILE_MB} MB.`); box.querySelector("input[type=file]").value=""; return; }
  const f = await shrink(file);
  files[i] = f;
  const th = box.querySelector(".thumb");
  th.innerHTML = f.type.startsWith("image/") && !f.type.includes("svg") ? `<img alt="" src="${URL.createObjectURL(f)}">` : esc(extOf(f.name).slice(0,4));
  box.querySelector(".pname").textContent = f.name;
  box.querySelector(".psize").textContent = fmtSize(f.size) + (f.size < file.size ? " (dikompres)" : "");
  box.classList.add("has"); box.classList.remove("invalid"); refresh();
}
form.addEventListener("change", e=>{
  if (e.target.type==="file"){ const i = +e.target.closest(".field").dataset.i; setFile(i, e.target.files[0]); }
});
form.addEventListener("click", e=>{
  const rm = e.target.closest("[data-rm]"); if (rm) clearFile(+rm.closest(".field").dataset.i);
});
["dragover","dragenter"].forEach(ev=>form.addEventListener(ev,e=>{ const d=e.target.closest("[data-drop]"); if(d){e.preventDefault(); d.classList.add("over");} }));
["dragleave","drop"].forEach(ev=>form.addEventListener(ev,e=>{ const d=e.target.closest("[data-drop]"); if(d) d.classList.remove("over"); }));
form.addEventListener("drop", e=>{
  const d = e.target.closest("[data-drop]"); if(!d) return;
  e.preventDefault(); setFile(+d.closest(".field").dataset.i, e.dataTransfer.files[0]);
});
window.addEventListener("dragover",e=>e.preventDefault()); window.addEventListener("drop",e=>e.preventDefault());

/* =====================================================================
   NILAI, VALIDASI, KARTU, PROGRES
   ===================================================================== */
function valueOf(i){
  const f = FIELDS[i];
  if (f.type==="file") return files[i] ? files[i].name : "";
  return boxOf(i).querySelector("input,select").value.trim();
}
function isValid(i){
  const f = FIELDS[i], v = valueOf(i);
  if (f.required && !v) return false;
  if (v && f.type==="email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return false;
  if (v && f.type==="tel" && !/^[0-9+\-\s()]{8,20}$/.test(v)) return false;
  return true;
}
function setText(id, txt, ph){
  const el = $("#"+id);
  if (el.textContent !== txt){
    el.textContent = txt; el.classList.toggle("ph", !!ph);
    el.classList.remove("fill-in"); void el.offsetWidth; if(!ph) el.classList.add("fill-in");
  }
}
function syncCard(){
  const g = k => valueOf(BYKEY[k]);
  const nm=g("nm"), npp=g("npp"), lok=g("lok"), tel=g("tel"), mail=g("mail"), kep=g("kep"), kode=g("kode"), fnm=g("fnm");
  setText("c_nm", nm||"Nama pegawai", !nm);
  setText("c_npp", "NPP "+(npp||"—"), !npp);
  setText("c_lok", lok||"—", !lok);
  setText("c_tel", tel||"—", !tel);
  setText("c_mail", mail||"—", !mail);
  setText("c_kep", kep||"—", !kep);
  const fk = (kode||fnm) ? `${kode||"—"} · ${fnm||"—"}` : "—";
  setText("c_fk", fk, !(kode||fnm));
  const fl = FIELDS.filter(f=>f.type==="file"), n = fl.filter(f=>files[f.i]).length;
  setText("c_doc", `${n} dari ${fl.length} berkas`, n===0);
}
function syncProgress(){
  let done = 0;
  reqFields.forEach((f,k)=>{ const ok = !!valueOf(f.i) && isValid(f.i); if(ok) done++; $("#segs").children[k].classList.toggle("on", ok); });
  $("#ptxt").textContent = `${done} dari ${reqFields.length} wajib terisi`;
  FIELDS.forEach(f=>{ if(f.type!=="file"){ const b = boxOf(f.i); b.classList.toggle("good", !!valueOf(f.i) && isValid(f.i) && !b.classList.contains("invalid")); }});
}
function refresh(){ syncCard(); syncProgress(); }
form.addEventListener("input", e=>{ if(e.target.type!=="file"){ e.target.closest(".field")?.classList.remove("invalid"); refresh(); } });
form.addEventListener("change", e=>{ if(e.target.type!=="file") refresh(); });

let cur = 0;
function show(s){
  cur = s;
  document.querySelectorAll(".step").forEach((x,i)=>x.hidden = i!==s);
  document.querySelectorAll(".st").forEach((x,i)=>{
    x.classList.toggle("cur", i===s); x.classList.toggle("done", i<s);
    x.firstElementChild.innerHTML = i<s ? CHECK : String(i+1);
  });
  $("#btnBack").hidden = s===0; $("#btnNext").hidden = s===LAST; $("#send").hidden = s!==LAST;
  $("#formWrap").scrollIntoView({behavior:"smooth",block:"start"});
}
function markStep(s){
  let first = null;
  FIELDS.filter(f=>f.step===s).forEach(f=>{
    const b = boxOf(f.i), ok = isValid(f.i); b.classList.toggle("invalid", !ok); if(!ok && !first) first = b;
  });
  return first;
}
function focusBox(b){
  b.scrollIntoView({block:"center",behavior:"smooth"});
  const i = b.querySelector("input:not([type=file]),select"); if(i) i.focus({preventScroll:true});
}
function goNext(){ const bad = markStep(cur); refresh(); if(bad){ focusBox(bad); return; } show(cur+1); }
$("#btnNext").addEventListener("click", goNext);
$("#btnBack").addEventListener("click", ()=>show(cur-1));

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),5500); }

/* =====================================================================
   KIRIM  (anti-CORS: no-cors + text/plain = simple request, aman dari file:// & localhost)
   ===================================================================== */
const toB64 = f => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(f); });

form.addEventListener("submit", async e=>{
  e.preventDefault();
  if (cur < LAST) { goNext(); return; }
  for (let s=0; s<=LAST; s++){ const bad = markStep(s); if (bad){ refresh(); if (s!==cur) show(s); setTimeout(()=>focusBox(bad),50); return; } }
  if (!GAS_URL || GAS_URL.startsWith("PASTE")) { toast("GAS_URL belum diisi di index.html"); return; }
  const total = Object.values(files).reduce((a,f)=>a+f.size,0);
  if (total > MAX_TOTAL_MB*1048576){ toast(`Total ukuran file ${fmtSize(total)} melebihi ${MAX_TOTAL_MB} MB. Perkecil file lalu coba lagi.`); return; }

  const btn = $("#send"); btn.disabled = true; btn.classList.add("loading"); $("#sendTxt").textContent = "Mengunggah… jangan tutup halaman";
  try{
    const payload = { fields:{}, files:[], _hp: form.querySelector("[name=_hp]").value };
    for (const f of FIELDS){
      if (f.type==="file"){
        if (files[f.i]) payload.files.push({ field:f.name, filename:files[f.i].name, mime:files[f.i].type||"application/octet-stream", data: await toB64(files[f.i]) });
      } else payload.fields[f.name] = valueOf(f.i);
    }
    await fetch(GAS_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload) });
    $("#formWrap").hidden = true; $("#done").hidden = false; $("#done").classList.add("show"); $("#card").classList.add("sent");
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(err){ toast("Gagal mengirim. Periksa koneksi internet lalu coba lagi."); }
  finally{ btn.disabled = false; btn.classList.remove("loading"); $("#sendTxt").textContent = "Kirim"; }
});

function resetAll(){
  HTMLFormElement.prototype.reset.call(form);
  FIELDS.forEach(f=>{ if(f.type==="file" && files[f.i]) clearFile(f.i); });
  form.querySelectorAll(".invalid").forEach(x=>x.classList.remove("invalid"));
  refresh(); show(0);
}
$("#btnReset").addEventListener("click", resetAll);
$("#again").addEventListener("click", ()=>{
  $("#done").hidden = true; $("#done").classList.remove("show"); $("#card").classList.remove("sent");
  $("#formWrap").hidden = false; resetAll(); window.scrollTo({top:0});
});

refresh(); show(0); window.scrollTo(0,0);
</script>
</body>
</html>
